[project]
name = "privforensics"
version = "0.1.0"
description = "Privacy-Preserving AI in Forensics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115,<1",
    "numpy>=2.2,<3",
    "opacus>=1.5.4,<2",
    "psutil>=7,<8",
    "pyarrow>=19,<25",
    "python-multipart>=0.0.22,<1",
    "reportlab>=4.4,<5",
    "scikit-learn>=1.6,<2",
    "torch>=2.8,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pypdf>=6,<7",
    "matplotlib>=3.10,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.privforensics]
title = "Privacy-Preserving AI in Forensics"
product = "PrivForensics"
team = [
    { name = "Student 1", registration = "Withheld" },
    { name = "Student 2", registration = "Withheld" },
    { name = "Student 3", registration = "Withheld" },
    { name = "Student 4", registration = "Withheld" },
]
